<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- あさよみ: くすんだ朝の空色の地に、紙面の向こうから昇る朝日をひとつ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1cb"/>
      <stop offset="1" stop-color="#6e92a5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c98f"/>
      <stop offset="1" stop-color="#e6985a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f2e8d7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope=".26"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="436" r="176" fill="url(#sun)"/>
  <g filter="url(#sh)">
    <rect x="236" y="436" width="552" height="356" rx="60" fill="url(#paper)"/>
  </g>
  <g stroke="#93abb7" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M320 544H704"/>
    <path d="M320 622H704"/>
    <path d="M320 700H556"/>
  </g>
</svg>
