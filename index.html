<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あさよみ</title>
<meta name="description" content="毎朝の雑学5選とニュース8選">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="あさよみ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 手描き風のゆらぎ(雑学のイラスト共通) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="hd" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="bar" id="bar"></header>
<main id="view"></main>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">このアプリは JavaScript を使います。</p></noscript>

<script type="module" src="src/main.js"></script>
<script>
  // 手元での確認中(localhost)は控えを使わない。直したものがすぐ出るようにするため。
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      // 新しい版が入ったら、その場で1回だけ読み込み直す(古い画面が出続けないように)。聞いている最中は待つ
      var had = !!navigator.serviceWorker.controller, done = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!had || done) return;
        done = true;
        var go = function () {
          var a = document.querySelectorAll('audio'), busy = false;
          for (var i = 0; i < a.length; i++) if (!a[i].paused) busy = true;
          if (window.__asayomiPlaying && window.__asayomiPlaying()) busy = true;
          if (busy) setTimeout(go, 30000); else location.reload();
        };
        go();
      });
    });
  }
</script>
</body>
</html>
